<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tron 钱包地址卡片</title>
  <style>
    :root{--blue:#0a8aff;--card-bg:#fff;--muted:#8b95a6}
    body{font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background: #fff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0}
    .frame{width:420px; border-radius:18px; padding:22px; background: linear-gradient(180deg,#0c8bff,#0580f7); box-shadow:0 4px 12px rgba(2,66,120,0.25);}
    .inner{background:var(--card-bg); border-radius:12px; padding:26px 20px; box-shadow:0 1px 0 rgba(0,0,0,0.03);}
    .badge{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:24px;background:#fff6f6;color:#2b2b2b;font-weight:600;margin:0 auto 18px;box-shadow:0 1px 0 rgba(0,0,0,0.04);}
    .badge svg{width:18px;height:18px}
    h2{font-size:18px;color:#667085;text-align:center;margin:6px 0 18px;font-weight:500}
    .qr-wrap{background:#fff;border-radius:14px;padding:18px;border:1px solid rgba(0,0,0,0.04);display:flex;justify-content:center}
    .qr{width:300px;height:300px;border-radius:10px;background:#fff;display:block}
    .addr-label{color:var(--muted);text-align:center;margin-top:18px;font-size:13px}
    .addr{font-size:18px;color:#2b3350;text-align:center;margin-top:8px;word-break:break-all;line-height:1.4}
    .footer{margin-top:20px;background:var(--blue);border-radius:8px;padding:18px;display:flex;align-items:center;justify-content:space-between;color:#fff}
    .imtoken{display:flex;align-items:center;gap:12px}
    .imtoken svg{width:36px;height:24px}
    .imtoken a{color:rgba(255,255,255,0.95);text-decoration:none;font-weight:600}
    .small-qr{width:64px;height:64px;border-radius:6px;background:#fff;padding:6px}
    .center{display:flex;flex-direction:column;align-items:center}
  </style>
</head>
<body>
  <div class="frame">
    <div class="inner">
      <div class="center">
        <div class="badge" aria-hidden>
          <!-- Tron icon (simple triangle) -->
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <path d="M12 2L22 20H2L12 2Z" fill="#FF6B6B"/>
          </svg>
          <span>Tron</span>
        </div>
        <h2>仅支持 Tron 资产 (TRC10/TRC20)</h2>
      </div>

      <div class="qr-wrap">
        <!-- QR image generated via Google Chart API for convenience -->
        <img id="mainQr" class="qr" alt="Tron QR" src="" />
      </div>

      <div class="addr-label">钱包地址</div>
      <div id="addressText" class="addr"></div>
      <div class="footer">
        <div class="imtoken">
          <!-- imToken stylized mark (simplified) -->
          <svg viewBox="0 0 32 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden>
            <path d="M6 10c0 3.314 2.686 6 6 6s6-2.686 6-6S15.314 4 12 4 6 6.686 6 10z" fill="#fff"/>
          </svg>
          <div>
            <div style="font-weight:700">imToken</div>
            <a href="https://token.im" target="_blank">https://token.im</a>
          </div>
        </div>
        <div>
          <img id="smallQr" class="small-qr" alt="imToken QR" src="https://chart.googleapis.com/chart?cht=qr&chs=120x120&chl=https://token.im" />
        </div>
      </div>
    </div>
  </div>

  <script>
    // 使用用户提供的 Tron 地址（已替换为你给出的地址）
    const TRON_ADDRESS = 'TAxVgpjRQeRBrH7oSY8KxkVJwNx82u5e8Y';

    // 生成主二维码（使用 Google Chart API 作为简便方案）
    const qrImg = document.getElementById('mainQr');
    const encoded = encodeURIComponent(TRON_ADDRESS);
    qrImg.src = `https://chart.googleapis.com/chart?cht=qr&chs=420x420&chl=${encoded}&chld=L|1`;

    // 显示地址：自动在接近中间处换行以匹配样式
    const addrEl = document.getElementById('addressText');
    function splitAddress(addr){
      if(!addr) return '';
      const len = addr.length;
      const mid = Math.ceil(len/2);
      return addr.slice(0, mid) + '<br>' + addr.slice(mid);
    }
    addrEl.innerHTML = splitAddress(TRON_ADDRESS);
  </script>
</body>
</html>
