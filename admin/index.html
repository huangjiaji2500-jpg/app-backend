  <script>
    window.$ = window.$ || (sel => document.querySelector(sel));
    window.__admin_status = window.__admin_status || (txt => { $('#status').textContent = txt; });

    // load admin secret from sessionStorage (use safe global to avoid duplicate const)
    window.__ADMIN_PANEL_SECRET_KEY = window.__ADMIN_PANEL_SECRET_KEY || 'ADMIN_PANEL_SECRET';
    window.adminSecretInput = window.adminSecretInput || (window.$ ? $('#adminSecret') : (document.getElementById ? document.getElementById('adminSecret') : null));
    if (window.adminSecretInput) window.adminSecretInput.value = sessionStorage.getItem(window.__ADMIN_PANEL_SECRET_KEY) || '';

    $('#saveSecret').onclick = () => {
      sessionStorage.setItem(window.__ADMIN_PANEL_SECRET_KEY, window.adminSecretInput && window.adminSecretInput.value.trim());
      window.__admin_status('管理员密钥已保存到 sessionStorage');
    };
    $('#clearSecret').onclick = () => { sessionStorage.removeItem(window.__ADMIN_PANEL_SECRET_KEY); if(window.adminSecretInput) window.adminSecretInput.value = ''; window.__admin_status('已清除'); };

    // Load current platform config and populate the visual form
    $('#load').onclick = async () => {
      status('加载中...');
      try {
        const r = await fetch('/api/public/platform-config');
        if(!r.ok) throw new Error(r.status + ' ' + r.statusText);
        const j = await r.json();
        // populate rate inputs
        try{
          const rates = j.displayRates || {};
          document.querySelectorAll('.rateInput').forEach(inp => { const k = inp.getAttribute('data-currency'); inp.value = rates[k] || ''; });
        }catch(e){ /* ignore */ }
        // populate platform deposit
        try{
          const pd = j.platformDeposit || {};
          $('#pdAddress').value = pd.address || pd.value || '';
          $('#pdNote').value = pd.note || pd.desc || '';
          if(pd.qrImage){ $('#pdPreview').src = pd.qrImage; $('#pdPreviewWrap').style.display = 'block'; }
          else { $('#pdPreview').src = ''; $('#pdPreviewWrap').style.display = 'none'; }
        }catch(e){ }
        status('已加载最新配置（来自: ' + (j.debug && j.debug.source ? j.debug.source : 'unknown') + ')');
      } catch(e){
        status('加载失败: ' + e.message);
      }
    };

    // Save whole config: rates + platformDeposit (includes optional syncAll flag)
    $('#save').onclick = async () => {
      const secret = sessionStorage.getItem(window.__ADMIN_PANEL_SECRET_KEY) || (window.adminSecretInput && window.adminSecretInput.value.trim());
      if(!secret){ status('缺少管理员密钥。请先粘贴并保存到 sessionStorage。'); return; }

      // collect displayRates from inputs
      const displayRates = {};
      document.querySelectorAll('.rateInput').forEach(inp => { const k = inp.getAttribute('data-currency'); const v = parseFloat(inp.value); if(!isNaN(v)) displayRates[k] = v; });

      // collect platformDeposit
      const platformDeposit = {};
      const addr = $('#pdAddress').value && $('#pdAddress').value.trim();
      const note = $('#pdNote').value && $('#pdNote').value.trim();
      if(addr) platformDeposit.address = addr;
      if(note) platformDeposit.note = note;
      // if preview image is a data URL, include it
      const imgSrc = $('#pdPreview').src || '';
      if(imgSrc && imgSrc.startsWith('data:')) platformDeposit.qrImage = imgSrc;

      const syncAll = !!$('#pdSyncAll').checked;

      status('保存中...');
      try{
        const r = await fetch('/api/admin/set-platform-config', {
          method: 'POST',
          headers: {
            'content-type': 'application/json',
            'x-admin-secret': secret
          },
          body: JSON.stringify({ displayRates: Object.keys(displayRates).length ? displayRates : undefined, platformDeposit: Object.keys(platformDeposit).length ? platformDeposit : undefined, syncAll })
        });
        const j = await r.json().catch(()=>({ok:false}));
        if(!r.ok) throw new Error((j && j.error) ? j.error : r.status + ' ' + r.statusText);
        status('保存成功');
      }catch(e){
        status('保存失败: ' + e.message);
      }
    };

    // Save rates button (separate quick action)
    document.getElementById('saveRates').onclick = async () => {
      const secret = sessionStorage.getItem(window.__ADMIN_PANEL_SECRET_KEY) || (window.adminSecretInput && window.adminSecretInput.value.trim());
      if(!secret){ document.getElementById('ratesStatus').textContent = '缺少管理员密钥'; return; }
      const displayRates = {};
      document.querySelectorAll('.rateInput').forEach(inp => { const k = inp.getAttribute('data-currency'); const v = parseFloat(inp.value); if(!isNaN(v)) displayRates[k] = v; });
      document.getElementById('ratesStatus').textContent = '保存中...';
      try{
        const r = await fetch('/api/admin/set-platform-config', { method:'POST', headers: { 'content-type':'application/json', 'x-admin-secret': secret }, body: JSON.stringify({ displayRates }) });
        const j = await r.json().catch(()=>({ok:false})); if(!r.ok) throw new Error((j && j.error) ? j.error : r.status + ' ' + r.statusText);
        document.getElementById('ratesStatus').textContent = '保存成功';
      }catch(e){ document.getElementById('ratesStatus').textContent = '保存失败: ' + e.message; }
    };

    // Preview rates
    document.getElementById('previewRates').onclick = () => {
      const preview = {};
      document.querySelectorAll('.rateInput').forEach(inp => { const k = inp.getAttribute('data-currency'); const v = parseFloat(inp.value); if(!isNaN(v)) preview[k] = v; });
      const el = document.getElementById('ratesPreview'); el.style.display = 'block'; el.textContent = '当前预览: ' + JSON.stringify(preview, null, 2);
    };

    // File upload -> convert to data URL and preview
    document.getElementById('pdFile').addEventListener('change', function(ev){
      const f = ev.target.files && ev.target.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = function(e){ try{ const data = e.target.result; $('#pdPreview').src = data; $('#pdPreviewWrap').style.display = 'block'; }catch(err){} };
      reader.readAsDataURL(f);
    });

    // Onboarding modal
    const onboardKey = 'ADMIN_ONBOARDED_V1';
    document.getElementById('onboardClose').onclick = () => { sessionStorage.setItem(onboardKey, '1'); document.getElementById('onboardModal').style.display = 'none'; };
    // show onboarding if first run
    (function(){ try{ if(!sessionStorage.getItem(onboardKey)) { document.getElementById('onboardModal').style.display = 'flex'; } }catch(e){} })();

    // Auto-load payments & users when admin secret present on page load
    window.addEventListener('load', () => {
      try{
        const s = sessionStorage.getItem(window.__ADMIN_PANEL_SECRET_KEY) || (window.adminSecretInput && window.adminSecretInput.value.trim());
        if(s){ // auto load
          setTimeout(()=>{ if(document.getElementById('loadPayments')) loadPayments(); if(document.getElementById('loadUsers')) loadUsers(); if(document.getElementById('load')) document.getElementById('load').click(); }, 400);
        }
      }catch(e){}
    });

    // Payments review with default pending filter + client-side pagination
    const paymentsStatus = sel => { $('#paymentsStatus').textContent = sel; };
    const rawResponseEl = $('#rawResponse');
    $('#toggleRaw').onclick = () => {
      if(!rawResponseEl) return;
      rawResponseEl.style.display = (rawResponseEl.style.display === 'none' || !rawResponseEl.style.display) ? 'block' : 'none';
    };
    const paymentsList = $('#paymentsList');
    const filterSelect = $('#filterSelect');

  let paymentsData = []; // raw from server
  let currentFilter = 'all';
    let pageSize = 8;
    let currentPage = 1;

  // 默认只显示待审核项
  filterSelect.value = 'pending';
    filterSelect.onchange = () => { currentFilter = filterSelect.value; currentPage = 1; renderPage(); };

    async function loadPayments() {
      paymentsStatus('加载中...');
      paymentsList.innerHTML = '';
      const secret = sessionStorage.getItem(window.__ADMIN_PANEL_SECRET_KEY) || (window.adminSecretInput && window.adminSecretInput.value.trim());
      if(!secret){ paymentsStatus('缺少管理员密钥'); return; }
      try{
        const r = await fetch('/api/admin/payments', { headers: { 'x-admin-secret': secret } });
        if(!r.ok){
          // remote error - fallback to local sample for immediate UI testing
          paymentsStatus('远端加载失败: ' + r.status + ' ' + r.statusText + '，使用本地模拟数据');
          await loadLocalFallback();
          return;
        }
        const j = await r.json();
        paymentsData = j.payments || [];
        paymentsStatus('已加载 ' + (paymentsData.length || 0) + ' 条（客户端）');
        try{ rawResponseEl.textContent = JSON.stringify(j, null, 2); }catch(e){ /* ignore */ }
        currentPage = 1;
        renderPage();
      }catch(e){ paymentsStatus('加载失败: ' + e.message); }
    }

    // 如果后端不可用，尝试回退到本地模拟数据文件（仅用于本地测试）
    async function loadLocalFallback(){
      try{
        const r = await fetch('./payments-sample.json');
        if(!r.ok) throw new Error('local file not found');
        const j = await r.json();
        // 支持两种格式：{ payments: [...] } 或 直接是数组
        paymentsData = j.payments || j || [];
        paymentsStatus('已加载本地模拟数据（仅本地测试）');
        try{ rawResponseEl.textContent = JSON.stringify(paymentsData, null, 2); }catch(e){}
        currentPage = 1; renderPage();
      }catch(e){ paymentsStatus('本地模拟数据加载失败: ' + e.message); }
    }

    function fmtDate(d){ try{ return new Date(d).toLocaleString(); }catch(e){ return d; } }
  // 状态映射，用于在 UI 中显示中文状态
  const statusMap = { pending: '待审核', approved: '已通过', rejected: '已拒绝' };
  function statusText(s){ return statusMap[s] || s || ''; }

    // robust helpers: extract display amount and proof image from heterogeneous records
    function getAmount(rec){
      try{
        const payload = (rec && rec.payload) || {};
        const item = payload.item || (payload.deposit && payload.deposit.item) || payload.deposit || payload || {};
        const toNum = v => { const n = Number(v); return (!isNaN(n) && n > 0 && n < 1000000) ? n : null; };
        const tryList = [
          item && (item.amountApprovedUSDT || item.amountApproved || item.amount),
          item && item.item && (item.item.amountApprovedUSDT || item.item.amountApproved || item.item.amount),
          item && (item.amountRequestedUSDT || item.amountRequested),
          rec && rec.amount, payload && payload.amount
        ];
        for(const c of tryList){ const n = toNum(c); if(n) return n; }

        // deep-scan for amount-like keys
        function scan(obj){
          if(!obj || typeof obj !== 'object') return null;
          for(const k of Object.keys(obj)){
            try{
              const v = obj[k]; if(v == null) continue;
              if(typeof v === 'object'){ const r = scan(v); if(r) return r; }
              const key = (''+k).toLowerCase();
              if(/amount|amt|usdt|requested|approved/.test(key)){
                const n = toNum(v); if(n) return n;
              }
            }catch(e){ /* ignore */ }
          }
          return null;
        }
        const s1 = scan(item) || scan(payload) || scan(rec);
        if(s1) return s1;

        // last resort: regex search in serialized JSON
        try{
          const s = JSON.stringify(rec||{});
          const matches = s.match(/\b(\d{1,7}(?:\.\d+)?)\b/g);
          if(matches && matches.length){
            for(const m of matches){ const n = Number(m); if(n>0 && n<1000000) return n; }
          }
        }catch(e){}
      }catch(e){}
      return 0;
    }

    function getProofSrc(rec){
      try{
        const payload = (rec && rec.payload) || {};
        const item = payload.item || (payload.deposit && payload.deposit.item) || payload.deposit || payload || {};
        const candidates = [
          rec && (rec.receiptViewUrl || rec.receiptUrl),
          item && (item.receiptViewUrl || item.receiptUrl || item.proofImage || item.proofImageUrl),
          item && item.item && (item.item.proofImage || item.item.proofImageUrl || item.item.receiptViewUrl || item.item.receiptUrl),
          payload && payload.deposit && (payload.deposit.proofImage || payload.deposit.proofImageUrl || payload.deposit.receiptUrl),
          item && item.images && item.images[0], item && item.attachments && item.attachments[0], item && item.image, item && item.screenshot
        ];
        for(const c of candidates){
          if(!c) continue;
          // arrays
          if(Array.isArray(c) && c.length){ const first = c[0]; if(first && typeof first === 'string') return first; }
          if(typeof c === 'string'){
            const s = c.trim();
            if(!s) continue;
            if(/^data:image\//i.test(s)) return s;
            if(/^https?:\/\//i.test(s) || /^\/\//.test(s)) return s;
            // likely raw base64 without data: prefix
            if(/^[A-Za-z0-9+/=]{100,}$/.test(s)) return 'data:image/jpeg;base64,' + s;
          }
        }
      }catch(e){}
      return null;
    }

    function renderPage(){
      if(!paymentsData || !paymentsData.length){ paymentsList.innerHTML = '<div class="small">没有充值凭证。</div>'; return; }
      // apply filter (尊重 payload.item.status / payload.status / top-level status)
      const filtered = paymentsData.filter(it => {
        if(currentFilter === 'pending'){
          const p = it && it.payload ? it.payload : {};
          const item = p.item || p.deposit || p || {};
          const st = (it && it.status) || item.status || p.status || 'pending';
          return st === 'pending';
        }
        return true;
      });
      const total = filtered.length;
      const pageCount = Math.max(1, Math.ceil(total / pageSize));
      if(currentPage > pageCount) currentPage = pageCount;
      const start = (currentPage - 1) * pageSize;
      const pageItems = filtered.slice(start, start + pageSize);

      paymentsList.innerHTML = '';
      if(!pageItems.length){ paymentsList.innerHTML = '<div class="small">此页无数据。</div>'; }
      pageItems.forEach(it => {
        const wrap = document.createElement('div');
        wrap.style.border = '1px solid #ddd';
        wrap.style.padding = '10px';
        wrap.style.marginBottom = '8px';

        // 兼容多种数据形态，优先使用 payload.item（或 payload.deposit.item）或嵌套的 item
        const payload = (it && it.payload) || {};
        const item = payload.item || (payload.deposit && payload.deposit.item) || payload.deposit || payload || {};
        const username = item.username || item.user || it.username || it.uid || payload.username || '未知';
        // Compute displayed amount with robust fallback (front-end only, no DB writes)
        const amount = getAmount(it);
        // compute proof url early so debug lines can reference it
        const receiptUrl = getProofSrc(it);
        const docId = it._id || it.id || (item.id || payload.id) || '-';
        const createdRaw = it.receivedAt || it.createdAt || payload.receivedAt || payload.createdAt || item.createdAt || item.ts || item.time || payload.ts || null;
        const created = createdRaw ? fmtDate(createdRaw) : '-';

        const title = document.createElement('div');
        title.innerHTML = `<strong>用户：</strong> ${username} &nbsp; | &nbsp; <strong>充值金额：</strong> ${amount} USDT &nbsp; | &nbsp; <strong>创建时间：</strong> ${created}`;

        const meta = document.createElement('div');
        meta.className = 'small';
        meta.style.marginTop = '6px';
        meta.textContent = `记录ID: ${docId}  状态: ${statusText(it.status || (item.status || payload.status) || 'pending')}`;
        wrap.appendChild(title);
        wrap.appendChild(meta);

        // --- Debug: add "查看原始" 按钮 和 简要调试字段，帮助定位为何金额为 0 ---
        try{
          const viewRawBtn = document.createElement('button');
          viewRawBtn.textContent = '查看原始';
          viewRawBtn.style.marginLeft = '8px';
          viewRawBtn.onclick = () => {
            try{
              document.getElementById('modalTitle').textContent = '凭证原始 - ' + docId;
              document.getElementById('modalBody').textContent = JSON.stringify(it, null, 2);
              document.getElementById('modal').style.display = 'flex';
            }catch(e){ alert('无法展示原始数据: ' + e.message); }
          };
          meta.appendChild(viewRawBtn);

          const debugDiv = document.createElement('div');
          debugDiv.className = 'small';
          debugDiv.style.marginTop = '6px';
          // show multiple candidate fields so admin can see which path is empty
          const debugText = 'debug: payload.amount=' + (payload && (payload.amount || ''))
            + '  payload.status=' + (payload && payload.status || '')
            + '  item.amountRequestedUSDT=' + (item && (item.amountRequestedUSDT || ''))
            + '  item.amountApprovedUSDT=' + (item && (item.amountApprovedUSDT || ''))
            + '  receipt=' + (receiptUrl ? 'present' : 'missing');
          debugDiv.textContent = debugText;
          wrap.appendChild(debugDiv);
        }catch(e){ /* safe ignore debug helpers on any error */ }

        // 充值凭证预览区域（更清晰的展示）
        const previewWrap = document.createElement('div');
        previewWrap.style.marginTop = '8px';
        const previewLabel = document.createElement('div');
        previewLabel.className = 'small';
        previewLabel.style.fontWeight = '600';
        previewLabel.textContent = '充值凭证预览：';
        previewWrap.appendChild(previewLabel);
        if(receiptUrl){
          const img = document.createElement('img');
          img.src = receiptUrl;
          img.alt = '充值凭证图片';
          img.style.maxWidth = '320px';
          img.style.display = 'block';
          img.style.marginTop = '6px';
          const svgPlaceholder = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180">'
            + '<rect width="100%" height="100%" fill="#f3f3f3"/>'
            + '<text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" '
            + 'font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#666">'
            + '暂无图片或无法加载</text></svg>'
          );
          img.onerror = function(){ this.onerror = null; try{ this.src = svgPlaceholder; }catch(e){} };
          previewWrap.appendChild(img);
        } else {
          const noImg = document.createElement('div');
          noImg.className = 'small';
          noImg.style.marginTop = '6px';
          noImg.textContent = '无凭证图片。';
          previewWrap.appendChild(noImg);
        }
        wrap.appendChild(previewWrap);
        // If the payment is still pending show editable adminNote + action buttons
        const pendingState = ((it && it.status) || (item && item.status) || (payload && payload.status) || 'pending');
        if (pendingState === 'pending') {
          const noteRow = document.createElement('div');
          noteRow.style.marginTop = '8px';
          const noteLabel = document.createElement('div');
          noteLabel.className = 'small';
          noteLabel.textContent = '审核备注（可选）：';
          const noteInput = document.createElement('textarea');
          noteInput.style.width = '100%';
          noteInput.style.height = '60px';
          noteInput.placeholder = '填写审核备注（例如：充值凭证清晰/金额不符等），可留空。';
          noteRow.appendChild(noteLabel);
          noteRow.appendChild(noteInput);
          wrap.appendChild(noteRow);

          // 允许管理员在审核时填写批准金额（USDT），若留空则使用申请金额
          const amtRow = document.createElement('div');
          amtRow.style.marginTop = '8px';
          const amtLabel = document.createElement('div');
          amtLabel.className = 'small';
          amtLabel.style.fontWeight = '600';
          amtLabel.textContent = '批准金额（USDT，可留空使用申请金额）：';
          const amtInput = document.createElement('input');
          amtInput.type = 'number';
          amtInput.style.width = '200px';
          // populate approve input from approved/amount/requested, also check nested item.item
          amtInput.value = (
            item.amountApprovedUSDT || item.amountApproved || item.amount ||
            (item.item && (item.item.amountApprovedUSDT || item.item.amountApproved || item.item.amount)) ||
            item.amountRequestedUSDT || item.amountRequested || ''
          );
          amtRow.appendChild(amtLabel);
          amtRow.appendChild(amtInput);
          wrap.appendChild(amtRow);

          const btnRow = document.createElement('div');
          btnRow.style.marginTop = '8px';
          const approve = document.createElement('button');
          approve.textContent = '通过';
          approve.onclick = () => handleAction(docId, 'approved', noteInput.value, amtInput.value);
          const reject = document.createElement('button');
          reject.textContent = '拒绝';
          reject.onclick = () => handleAction(docId, 'rejected', noteInput.value, null);
          btnRow.appendChild(approve);
          btnRow.appendChild(reject);
          wrap.appendChild(btnRow);

        } else {
          // already reviewed - show readonly info
          const info = document.createElement('div');
          info.className = 'small';
          info.style.marginTop = '8px';
          const adminNoteText = (payload && payload.adminNote) || it.adminNote || '';
          const statusVal = (it && it.status) || (item && item.status) || (payload && payload.status) || '';
          const noteText = adminNoteText ? (' 备注：' + adminNoteText) : '';
          info.textContent = '已审核：' + statusText(statusVal) + noteText;
          wrap.appendChild(info);

          // 如果已经审批通过，显示“删除”按钮（仅前端页面级删除）
          try{
            // 只在明确为通过状态时展示删除按钮
            if((statusVal || '').toString().toLowerCase() === 'approved' || (statusVal || '').toString().toLowerCase() === '已通过'){
              const delBtn = document.createElement('button');
              delBtn.textContent = '删除';
              delBtn.style.marginLeft = '8px';
              delBtn.onclick = () => {
                const ok = confirm('确定删除该已审批记录吗？');
                if(!ok) return;
                // 前端从内存 paymentsData 中移除该记录并刷新页面（不写入服务器）
                try{
                  const matchId = docId;
                  if(!matchId || matchId === '-'){
                    // 如果没有可用 id，则通过序列化比较进行删除尝试
                    const before = paymentsData.length;
                    paymentsData = paymentsData.filter(p => JSON.stringify(p) !== JSON.stringify(it));
                    const after = paymentsData.length;
                    renderPage();
                    paymentsStatus('已从页面移除记录（仅前端）');
                    return;
                  }
                  const idx = paymentsData.findIndex(p => {
                    const pid = (p && (p._id || p.id)) || (p && p.payload && (p.payload.id || p.payload._id)) || '';
                    return pid && pid.toString() === matchId.toString();
                  });
                  if(idx >= 0){ paymentsData.splice(idx, 1); renderPage(); paymentsStatus('已从页面移除记录（仅前端）'); }
                  else { // fallback: remove any item whose serialized content equals
                    paymentsData = paymentsData.filter(p => JSON.stringify(p) !== JSON.stringify(it));
                    renderPage(); paymentsStatus('已从页面移除记录（仅前端）');
                  }
                }catch(e){ alert('删除失败: ' + e.message); }
              };
              wrap.appendChild(delBtn);
            }
          }catch(e){ /* ignore deletion UI errors */ }
        }
        paymentsList.appendChild(wrap);
      });

      // pagination controls
      const pager = document.createElement('div');
      pager.style.marginTop = '8px';
      const prev = document.createElement('button');
      prev.textContent = '上一页';
      prev.disabled = currentPage <= 1;
      prev.onclick = () => { if(currentPage>1){ currentPage--; renderPage(); } };
      const next = document.createElement('button');
      next.textContent = '下一页';
      next.style.marginLeft = '8px';
      next.disabled = currentPage >= pageCount;
      next.onclick = () => { if(currentPage<pageCount){ currentPage++; renderPage(); } };
      const info = document.createElement('span');
      info.className = 'small';
      info.style.marginLeft = '12px';
      info.textContent = `第 ${currentPage} / ${pageCount} 页 （共 ${total} 条）`;
      pager.appendChild(prev);
      pager.appendChild(next);
      pager.appendChild(info);
      paymentsList.appendChild(pager);
    }

    async function handleAction(id, action, adminNote, amountApprovedUSDT){
      const actionMap = { approved: '通过', rejected: '拒绝' };
  const ok = confirm('确定要将凭证 ' + id + ' 标为: ' + (actionMap[action] || action) + ' ？');
      if(!ok) return;
      paymentsStatus('提交中...');
      const secret = sessionStorage.getItem(window.__ADMIN_PANEL_SECRET_KEY) || (window.adminSecretInput && window.adminSecretInput.value.trim());
      try{
        const body = { id, action, adminNote: adminNote || null };
        if(typeof amountApprovedUSDT !== 'undefined' && amountApprovedUSDT !== null && amountApprovedUSDT !== ''){
          const n = Number(amountApprovedUSDT) || 0;
          body.amountApprovedUSDT = n;
        }
        const r = await fetch('/api/admin/payments', {
          method: 'PATCH',
          headers: { 'content-type': 'application/json', 'x-admin-secret': secret },
          body: JSON.stringify(body)
        });
        const j = await r.json().catch(()=>({ok:false}));
        if(!r.ok) throw new Error((j && j.error) ? j.error : r.status + ' ' + r.statusText);
        paymentsStatus('操作成功，刷新列表...');
        await loadPayments();
      }catch(e){ paymentsStatus('操作失败: ' + e.message); }
    }

    $('#loadPayments').onclick = loadPayments;
    // 打开用户管理区（滚动到页面内）
    const openBtn = document.getElementById('openUsers');
    if(openBtn) openBtn.onclick = () => { const s = document.getElementById('usersSection'); if(s) s.scrollIntoView({behavior:'smooth'}); };
  </script>
  <script>
    // ========== 用户管理脚本 ==========
    const usersStatusEl = document.getElementById('usersStatus');
    const usersBody = document.getElementById('usersBody');
    const qInput = document.getElementById('q');

    function usersStatus(txt){ if(usersStatusEl) usersStatusEl.textContent = txt; }

    async function loadUsers(){
      usersStatus('加载中...');
      if(usersBody) usersBody.innerHTML = '';
      const secret = sessionStorage.getItem(window.__ADMIN_PANEL_SECRET_KEY) || (window.adminSecretInput && window.adminSecretInput.value.trim());
      if(!secret){ usersStatus('缺少管理员密钥'); return; }
      try{
        const r = await fetch('/api/admin/users', { headers: { 'x-admin-secret': secret } });
        if(!r.ok) throw new Error(r.status + ' ' + r.statusText);
        const j = await r.json();
        if(!j.ok) throw new Error(j.error || 'unknown');
        userRenderUsers(j.users || []);
        usersStatus(`已加载 ${j.count || (j.users||[]).length} 位用户`);
      }catch(e){ usersStatus('加载失败: ' + e.message); }
    }

    function userRenderUsers(list){
      if(!usersBody) return;
      usersBody.innerHTML = '';
      const q = (qInput && qInput.value || '').toLowerCase().trim();
      const filtered = (list||[]).filter(u=>{
        if(!q) return true;
        return (u.id||'').toString().toLowerCase().includes(q) || (u.displayName||'').toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q);
      });
      if(filtered.length===0){ usersBody.innerHTML = '<tr><td colspan="7" class="small">无用户</td></tr>'; return; }
      filtered.forEach(u=>{
        const tr = document.createElement('tr');
        const devs = u.devices ? Object.keys(u.devices).map(k=>`${k} (${u.devices[k] && u.devices[k].lastSeen? new Date(u.devices[k].lastSeen).toLocaleString() : ''})`).join('\n') : '';
        tr.innerHTML = `<td>${u.id||''}</td><td>${u.displayName||''}</td><td>${u.email||''}</td><td>${u.createdAt? new Date(u.createdAt).toLocaleString(): '-'}</td><td>${u.lastLoginAt? new Date(u.lastLoginAt).toLocaleString(): '-'}</td><td><pre style="white-space:pre-wrap;margin:0">${devs}</pre></td><td><button class="viewBtn" data-id="${u.id}">查看</button> <button class="disableBtn" data-id="${u.id}">${u.disabled? '启用':'禁用'}</button> <button class="resetBtn" data-id="${u.id}">生成临时密码（仅显示一次）</button></td>`;
        usersBody.appendChild(tr);
      });
      // attach handlers
      document.querySelectorAll('#usersBody .viewBtn').forEach(btn=> btn.onclick = (ev)=>{ const id = ev.currentTarget.getAttribute('data-id'); userFetchUserDetail(id); });
      document.querySelectorAll('#usersBody .disableBtn').forEach(btn=> btn.onclick = (ev)=>{ const id = ev.currentTarget.getAttribute('data-id'); userToggleDisable(id, ev.currentTarget); });
      document.querySelectorAll('#usersBody .resetBtn').forEach(btn=> btn.onclick = (ev)=>{ const id = ev.currentTarget.getAttribute('data-id'); userResetPassword(id); });
    }

    // modal handlers
    if(document.getElementById('modalClose')) document.getElementById('modalClose').onclick = () => { document.getElementById('modal').style.display = 'none'; };

    async function userFetchUserDetail(id){
      const secret = sessionStorage.getItem(window.__ADMIN_PANEL_SECRET_KEY) || (window.adminSecretInput && window.adminSecretInput.value.trim());
      if(!secret){ usersStatus('缺少管理员密钥'); return; }
      usersStatus('加载用户详情...');
      try{
        const r = await fetch('/api/admin/users?id=' + encodeURIComponent(id), { headers: { 'x-admin-secret': secret } });
        if(!r.ok) throw new Error(r.status + ' ' + r.statusText);
        const j = await r.json(); if(!j.ok) throw new Error(j.error || 'unknown');
        document.getElementById('modalTitle').textContent = '用户详情 — ' + (j.user && (j.user.username || j.user._id || j.user.id) || id);
        document.getElementById('modalBody').textContent = JSON.stringify(j.user || j, null, 2);
        document.getElementById('modal').style.display = 'flex';
        usersStatus('');
      }catch(e){ usersStatus('加载详情失败: ' + e.message); }
    }

    async function userToggleDisable(id, btn){
      const ok = confirm('确定要切换用户 ' + id + ' 的启用/禁用 状态吗？'); if(!ok) return;
      const secret = sessionStorage.getItem(window.__ADMIN_PANEL_SECRET_KEY) || (window.adminSecretInput && window.adminSecretInput.value.trim()); if(!secret){ usersStatus('缺少管理员密钥'); return; }
      try{
        const r0 = await fetch('/api/admin/users?id=' + encodeURIComponent(id), { headers: { 'x-admin-secret': secret } });
        if(!r0.ok) throw new Error(r0.status + ' ' + r0.statusText);
        const j0 = await r0.json(); if(!j0.ok) throw new Error(j0.error || 'unknown');
        const cur = !!(j0.user && j0.user.disabled);
        const r = await fetch('/api/admin/users', { method: 'PATCH', headers: { 'x-admin-secret': secret, 'content-type': 'application/json' }, body: JSON.stringify({ id: id, disabled: !cur }) });
        if(!r.ok) throw new Error(r.status + ' ' + r.statusText);
        const j = await r.json(); if(!j.ok) throw new Error(j.error || 'unknown');
        alert('操作成功'); loadUsers();
      }catch(e){ usersStatus('操作失败: ' + e.message); }
    }

    async function userResetPassword(id){
      const ok = confirm('确定要为用户 ' + id + ' 生成临时密码吗？该密码只会显示一次，请及时复制并转交给用户。'); if(!ok) return;
      const secret = sessionStorage.getItem(window.__ADMIN_PANEL_SECRET_KEY) || (window.adminSecretInput && window.adminSecretInput.value.trim()); if(!secret){ usersStatus('缺少管理员密钥'); return; }
      try{
        const r = await fetch('/api/admin/users', { method: 'PATCH', headers: { 'x-admin-secret': secret, 'content-type': 'application/json' }, body: JSON.stringify({ id: id, resetPassword: true }) });
        if(!r.ok) throw new Error(r.status + ' ' + r.statusText);
        const j = await r.json(); if(!j.ok) throw new Error(j.error || 'unknown');
        const temp = j.update && j.update.tempPassword ? j.update.tempPassword : null;
        if(temp) alert('已生成临时密码（仅显示一次）：\n' + temp + '\n\n请立即复制并转交给用户；页面不会再次显示该明文密码。');
        else alert('已标记为需要重置密码（未返回临时密码）');
        loadUsers();
      }catch(e){ usersStatus('操作失败: ' + e.message); }
    }

    // bind
    if(document.getElementById('loadUsers')) document.getElementById('loadUsers').onclick = loadUsers;
    if(qInput) qInput.oninput = () => { if(usersBody && usersBody.childElementCount) loadUsers(); };
  </script>
</body>
</html>
