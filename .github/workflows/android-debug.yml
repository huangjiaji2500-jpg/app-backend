name: Android Debug Build (Validation)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print confirmation
        run: echo "android-debug.yml parsed successfully"
name: Android Debug Build (Cloud)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'android/**'
      name: Android Debug Build (Cloud)

      on:
        workflow_dispatch:
        push:
          paths:
            - 'android/**'
            - 'app/**'
            - 'src/**'
            - '.github/workflows/**'

      jobs:
        build-debug-apk:
          name: Build Android Debug APK
          runs-on: ubuntu-latest
          env:
            ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
          steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 11
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '11'

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'

            name: Android Debug Build (Validation)

            on:
              workflow_dispatch:

            jobs:
              validate-yaml:
                runs-on: ubuntu-latest
                steps:
                  - name: Checkout
                    uses: actions/checkout@v4
                  - name: Print confirmation
                    run: echo "android-debug.yml parsed successfully"
                yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-31" "build-tools;31.0.0"
