name: Android Debug Build (Validation)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/**'

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print confirmation
        run: echo "android-debug.yml parsed successfully"
name: Android Debug Build (Cloud)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'android/**'
      name: Android Debug Build (Cloud)

      on:
        workflow_dispatch:
        push:
          paths:
            - 'android/**'
            - 'app/**'
            - 'src/**'
            - '.github/workflows/**'

      jobs:
        build-debug-apk:
          name: Build Android Debug APK
          runs-on: ubuntu-latest
          env:
            ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
          steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 11
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: '11'

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '18'

            - name: Install npm dependencies
              run: npm ci

            - name: Install Android SDK commandline tools
              run: |
                mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
                cd $ANDROID_SDK_ROOT/cmdline-tools
                curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
                unzip -q commandlinetools.zip
                mv cmdline-tools latest || true

            - name: Accept licenses and install platform/build-tools
              run: |
                yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-31" "build-tools;31.0.0"

            - name: Build debug APK with Gradle
              working-directory: android
              run: ./gradlew assembleDebug --no-daemon
name: Android Debug Build (Validation)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
