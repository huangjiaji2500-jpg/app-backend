name: Android Debug Build (Full)

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'app/**'
      - 'src/**'
      - '.github/workflows/**'

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/.android-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Android SDK commandline tools
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          echo "Downloading commandlinetools..."
          curl -f -L --retry 5 --retry-connrefused -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip -q commandlinetools.zip
          mv cmdline-tools latest || true

      - name: Accept licenses and install platform/build-tools
        run: |
          # ensure sdkmanager is on PATH for this step
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          mkdir -p $ANDROID_SDK_ROOT/licenses
          # install common platforms and build-tools used by Android projects
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-31" "platforms;android-33" "build-tools;31.0.0" "build-tools;33.0.2"
          # accept all licenses non-interactively
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses || true

      - name: List repository (debug)
        run: |
          echo "Repository tree:"
          ls -la || true
          echo "Top-level files:"
          find . -maxdepth 2 -type d -print || true

      - name: Print Java & environment info
        run: |
          echo "=== java -version ==="
          java -version || true
          echo "=== env | sort ==="
          env | sort || true
          echo "=== which java ==="
          which java || true
          echo "=== ls android contents ==="
          ls -la android || true

      - name: Write android/local.properties for sdk location
        run: |
          echo "Writing local.properties pointing to Android SDK"
          mkdir -p android || true
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          echo "local.properties content:" && cat android/local.properties || true

      - name: Build debug APK with Gradle (safe)
        shell: bash
        run: |
          set -euxo pipefail
          echo "DEBUG: Listing workspace top-level"
          ls -la || true
          echo "DEBUG: Listing android directory"
          ls -la android || true

          if [ ! -d "./android" ]; then
            echo "ERROR: 'android' directory not found in repository root." >&2
            exit 1
          fi

          # Normalize line endings of gradlew in case of CRLF issues from Windows commits
          if [ -f android/gradlew ]; then
            echo "DEBUG: gradlew shebang: "
            head -n 1 android/gradlew || true
            echo "DEBUG: normalizing line endings for android/gradlew"
            sed -i 's/\r$//' android/gradlew || true
            chmod +x android/gradlew || true
          else
            echo "ERROR: android/gradlew not found" >&2
            exit 127
          fi

          # set GRADLE user home to workspace-local cache
          export GRADLE_USER_HOME="${GITHUB_WORKSPACE}/.gradle"
          mkdir -p "$GRADLE_USER_HOME"
          cd android

          # ensure platform-tools are available in PATH for gradle (adb if used)
          export PATH="$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          echo "=== ./gradlew --version output ==="
          ./gradlew --version || true
          echo "=== Running assembleDebug with --stacktrace --info ==="
          ./gradlew assembleDebug --no-daemon --stacktrace --info
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create GitHub release for debug APK
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: debug-${{ github.run_id }}
          release_name: Debug APK ${{ github.run_number }}
          body: "Automated debug APK from workflow run ${{ github.run_id }}"
          draft: false
          prerelease: true

      - name: Upload APK to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: android/app/build/outputs/apk/debug/app-debug.apk
          asset_name: app-debug-${{ github.run_id }}.apk
          asset_content_type: application/vnd.android.package-archive
